<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Portal</title>
<style>
/* ULTRA MINIMAL CSS - Black & White, No animations/shadows/gradients */
body { font-family: sans-serif; background: #fff; color: #000; margin: 0; padding: 10px; }
h3 { margin-top: 0; border-bottom: 2px solid #000; padding-bottom: 5px; }
.box { border: 1px solid #000; padding: 10px; margin-bottom: 15px; }
label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
input[type="text"], textarea { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #666; box-sizing: border-box; }
.chk-group { margin-bottom: 15px; }
.chk-group label { font-weight: normal; margin-bottom: 4px; }
button { width: 100%; padding: 15px; background: #000; color: #fff; font-weight: bold; border: none; font-size: 16px; margin-top: 10px; }
button:disabled { background: #666; }
.msg { padding: 10px; margin-bottom: 10px; border: 1px solid #000; display: none; }
.card { border: 1px dashed #000; padding: 8px; margin-bottom: 8px; font-size: 14px; }
.small { font-size: 12px; color: #444; }
</style>
</head>
<body>

<div class="box">
    <h3 id="status">Node: ...</h3>
    <form id="frm">
        <div class="chk-group">
            <b>Status (Check all that apply):</b><br>
            <label><input type="checkbox" id="chk1"> Trapped</label>
            <label><input type="checkbox" id="chk2"> Injured</label>
            <label><input type="checkbox" id="chk3"> Need Water</label>
            <label><input type="checkbox" id="chk4"> Need Meds</label>
        </div>
        
        <label>Victim Count:</label>
        <input type="number" id="vCount" value="1" min="1" max="99" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
        
        <label>Location / Room *</label>
        <input type="text" id="loc" required maxlength="15">
        
        <label>Name</label>
        <input type="text" id="nam" maxlength="15">
        
        <label>Message</label>
        <textarea id="msg" rows="2" maxlength="60"></textarea>
        
        <button type="submit" id="btn">SEND SOS</button>
    </form>
</div>

<div id="alert" class="msg"></div>

<div class="box">
    <h3>Reports (<span id="rCount">0</span>)</h3>
    <button type="button" id="btnRefresh" style="padding:10px; margin-bottom:10px;">Refresh List</button>
    <div id="list"></div>
</div>

<script>
// MINIMAL JAVASCRIPT
const el = id => document.getElementById(id);
const alertBox = el('alert');

el('frm').onsubmit = async (e) => {
    e.preventDefault();
    el('btn').disabled = true;
    el('btn').innerText = 'SENDING...';
    
    const payload = {
        trapped: el('chk1').checked,
        injured: el('chk2').checked,
        needWater: el('chk3').checked,
        needMeds: el('chk4').checked,
        victimCount: parseInt(el('vCount').value),
        location: el('loc').value,
        name: el('nam').value || 'Anon',
        text: el('msg').value
    };

    try {
        const res = await fetch('/api/sos', { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        alertBox.innerText = data.success ? 'SENT OK! ID: ' + data.msgId : 'FAILED';
        alertBox.style.display = 'block';
        loadList();
    } catch(e) {
        alertBox.innerText = 'ERROR';
        alertBox.style.display = 'block';
    }
    
    el('btn').disabled = false;
    el('btn').innerText = 'SEND SOS';
    setTimeout(() => alertBox.style.display = 'none', 5000);
};

async function loadStatus() {
    try {
        const res = await fetch('/api/status');
        if(res.ok) {
            const d = await res.json();
            el('status').innerText = `Node 0x${d.nodeId} | Offline: ${d.offlineSosCount}`;
        }
    } catch(e) {}
}

async function loadList() {
    try {
        const res = await fetch('/api/distress-list');
        if(res.ok) {
            const list = await res.json();
            el('rCount').innerText = list.length;
            el('list').innerHTML = list.map(i => `
                <div class="card">
                    <b>${i.location}</b> (${i.victimCount} ppl)<br>
                    <span class="small">
                    ${i.trapped?'[TRAPPED]':''} ${i.injured?'[INJURED]':''} 
                    ${i.needWater?'[WATER]':''} ${i.needMeds?'[MEDS]':''}
                    <br>${i.text}<br>By: ${i.name}
                    </span>
                </div>
            `).join('');
        }
    } catch(e) {}
}

el('btnRefresh').onclick = loadList;
loadStatus();
loadList();
setInterval(loadStatus, 5000);
</script>
</body>
</html>
